<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f2937">
  <title>Offline | Modern Fashion Store</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f9fafb;
           color: #111827; font-family: ui-sans-serif, system-ui, sans-serif; }
    main { max-width: 32rem; padding: 2rem 1.5rem; text-align: center; }
    h1 { margin: 1rem 0 .75rem; font-size: 1.75rem; }
    p { margin: 0 0 1.5rem; color: #4b5563; line-height: 1.6; }
    a { display: inline-block; padding: .6rem 1.2rem; border-radius: .375rem; background: #dc2626;
        color: #fff; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="/images/logo.svg" width="56" height="56" alt="">
    <h1>You're offline</h1>
    <p>The dashboard shows live data, so it needs a connection. Check your network and try again.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
