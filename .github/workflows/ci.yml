name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tagline
          POSTGRES_PASSWORD: postgres
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U tagline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      # keep in sync with mise.toml and the Dockerfile
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.1"
          elixir-version: "1.20.4"

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mise.toml', 'mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get
      - run: mix hex.audit
      - run: mix format --check-formatted
      - run: mix deps.unlock --check-unused
      # compile, Credo, Sobelow and the tests, as run locally before a commit
      - run: mix precommit

      - uses: actions/cache@v6
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ hashFiles('mise.toml', 'mix.lock') }}
          restore-keys: plt-${{ runner.os }}-
      - run: mix dialyzer --format github

  # Builds the release image, scans it and, on main, publishes it to GHCR, so the server
  # only pulls (infra decision 0004: no builds on the home server).
  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/akoskappel/tagline
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      # Built into the local Docker engine first, so the scan sees the exact image.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tagline:scan
          build-args: GIT_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Fails on fixable high or critical vulnerabilities; scans never run on the home server.
      # Pinned to a commit: this action's tags were hijacked in a 2026 supply-chain attack.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tagline:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: GIT_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
