name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tagline
          POSTGRES_PASSWORD: postgres
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U tagline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      # keep in sync with mise.toml and the Dockerfile
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.1"
          elixir-version: "1.20.4"

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mise.toml', 'mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get
      - run: mix hex.audit
      - run: mix format --check-formatted
      - run: mix deps.unlock --check-unused
      # compile, Credo, Sobelow and the tests, as run locally before a commit
      - run: mix precommit

      - uses: actions/cache@v6
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ hashFiles('mise.toml', 'mix.lock') }}
          restore-keys: plt-${{ runner.os }}-
      - run: mix dialyzer --format github

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag tagline:ci .
