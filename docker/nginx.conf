# like "combined", but with the visitor's IP from the proxy in front (the Tailscale sidecar)
log_format proxied '$remote_addr for $http_x_forwarded_for - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

# rate limits keyed by the visitor (set by the sidecar), not the sidecar itself;
# local requests have no X-Forwarded-For, and an empty key would never be limited
map $http_x_forwarded_for $client_key {
    ""      $binary_remote_addr;
    default $http_x_forwarded_for;
}
limit_req_zone $client_key zone=login:10m rate=10r/m;
limit_req_zone $client_key zone=general:10m rate=10r/s;
# product writes (create/update/delete); reads get an empty key, which is never limited
map $request_method $product_write_key {
    GET     "";
    HEAD    "";
    default $client_key;
}
limit_req_zone $product_write_key zone=writes:10m rate=30r/m;
limit_req_status 429;
limit_conn_zone $client_key zone=liveconn:10m;
limit_conn_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log proxied;
    error_log  /var/log/nginx/error.log;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # product forms only carry text (photos are URLs)
    client_max_body_size 1M;

    # Docker's DNS; re-resolve the app container so recreating it doesn't leave a stale IP
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream http://app:4000;

    absolute_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location = /users/log_in {
        limit_req zone=login burst=5 nodelay;
        proxy_pass $app_upstream;
    }

    # LiveView websocket (and long-poll fallback)
    location /live {
        limit_conn liveconn 20;
        # proxy_set_header isn't inherited once a location sets its own, so repeat the server ones
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_pass $app_upstream;
    }

    # sets no proxy_set_header of its own, so it inherits the server ones
    location /products {
        limit_req zone=general burst=40 nodelay;
        limit_req zone=writes burst=10 nodelay;
        proxy_pass $app_upstream;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass $app_upstream;
    }
}
