# Container output is kept in at most 3 files of 10 MB each.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18
    container_name: ${CONTAINER_PREFIX:-tagline}-db
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      POSTGRES_DB: ${DB_DATABASE:-tagline}
      POSTGRES_USER: ${DB_USERNAME:-tagline}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  # PostgreSQL 18 data (postgres:18 mounts /var/lib/postgresql)
  dbdata:
