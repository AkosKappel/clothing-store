# Container output is kept in at most 3 files of 10 MB each.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18
    container_name: ${CONTAINER_PREFIX:-tagline}-db
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      POSTGRES_DB: ${DB_DATABASE:-tagline}
      POSTGRES_USER: ${DB_USERNAME:-tagline}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # the app's own non-superuser role, see docker/db/init/02-app-role.sh
      DB_APP_USERNAME: ${DB_APP_USERNAME:-}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-}
    volumes:
      - dbdata:/var/lib/postgresql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network

  app:
    build:
      context: .
      args:
        GIT_REVISION: ${GIT_REVISION:-unknown}
    image: tagline-app
    container_name: ${CONTAINER_PREFIX:-tagline}-app
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      # the app role when set (DB_APP_*), otherwise the superuser
      DATABASE_URL: ecto://${DB_APP_USERNAME:-${DB_USERNAME:-tagline}}:${DB_APP_PASSWORD:-${DB_PASSWORD:?set DB_PASSWORD in .env}}@db/${DB_DATABASE:-tagline}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      PHX_HOST: ${PHX_HOST:-tagline.tailb52c43.ts.net}
      PORT: "4000"
      POOL_SIZE: "5"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@eshop.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      DEMO_RESET_ENABLED: ${DEMO_RESET_ENABLED:-true}
      DEMO_RESET_TIME: ${DEMO_RESET_TIME:-03:15}
      DEMO_RESET_TIMEZONE: ${DEMO_RESET_TIMEZONE:-Europe/Bratislava}
      # simulated sales every few minutes (minutes between them, roughly)
      DEMO_ACTIVITY_ENABLED: ${DEMO_ACTIVITY_ENABLED:-true}
      DEMO_ACTIVITY_INTERVAL: ${DEMO_ACTIVITY_INTERVAL:-4}
      # About page; empty values keep the defaults from config/config.exs
      DEMO_AUTHOR: ${DEMO_AUTHOR:-}
      DEMO_GITHUB_URL: ${DEMO_GITHUB_URL:-}
      DEMO_REPOSITORY_URL: ${DEMO_REPOSITORY_URL:-}
      DEMO_LINKEDIN_URL: ${DEMO_LINKEDIN_URL:-}
      DEMO_PORTFOLIO_URL: ${DEMO_PORTFOLIO_URL:-}
      # distribution cookie for `bin/clothing_store rpc`; empty uses the one baked into the image
      RELEASE_COOKIE: ${RELEASE_COOKIE:-}
      # the BEAM's schedulers see all host CPUs; keep them modest next to other apps
      ERL_FLAGS: "+S 2:2"
    # the release only writes its runtime config to /tmp (RELEASE_TMP, rel/env.sh.eex)
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    # GET /health is 200 once Phoenix is up and can query the database; the first
    # start also migrates and seeds, hence the long start period
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
      start_interval: 2s

  nginx:
    image: nginx:1.30-alpine
    container_name: ${CONTAINER_PREFIX:-tagline}-nginx
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8083}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/maintenance:/usr/share/nginx/maintenance:ro
      - ${ACCESS_LOG_DIR:-./tmp/nginx}:/var/log/nginx/shared
    # what the master process needs to bind :80, switch workers to the nginx user, and
    # create log files in the host folder (owned by the host user, hence DAC_OVERRIDE)
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    networks:
      - app-network
    depends_on:
      app:
        condition: service_healthy

networks:
  app-network:
    driver: bridge

volumes:
  # PostgreSQL 18 data (postgres:18 mounts /var/lib/postgresql)
  dbdata:
